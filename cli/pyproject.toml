[project]
name = "deckdock"
version = "0.1.0"
description = "Compile Anki decks written as YAML into the deckdock/1 JSON format."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "markdown-it-py>=3.0",
]

[project.scripts]
deckdock = "deckdock.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
    "ruff",
    "basedpyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckdock"]
include = [
    "src/deckdock/build/notetypes/*",
    "src/deckdock/scaffold/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
