[project]
name = "deckdock"
version = "0.2.0"
description = "Reference checker and Python library for the deckdock/1 Anki deck format"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
deckdock = "deckdock.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
    "ruff",
    "basedpyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckdock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
