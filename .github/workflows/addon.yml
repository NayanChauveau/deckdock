name: addon

on:
  push:
    paths: [addon/**, cli/src/**, .github/workflows/addon.yml]
  pull_request:
    paths: [addon/**, cli/src/**, .github/workflows/addon.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries (aqt imports PyQt6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest -q
