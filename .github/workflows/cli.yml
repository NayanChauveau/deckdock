name: cli

on:
  push:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]
  pull_request:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Scaffold a deck
        run: uvx --from ./cli deckdock init /tmp/hello
      - name: Build with the local action
        uses: ./action
        with:
          command: build
          path: /tmp/hello
          deckdock-ref: local
      - name: Check the build output
        run: uvx --from ./cli deckdock check /tmp/hello/dist
