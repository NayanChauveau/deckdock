name: cli

on:
  push:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]
  pull_request:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest -q
