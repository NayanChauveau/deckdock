name: cli

on:
  push:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]
  pull_request:
    paths: [cli/**, spec/**, action/**, .github/workflows/cli.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build a valid dist from the minimal example
        run: |
          mkdir -p /tmp/dist/en
          cp spec/examples/valid/minimal.json /tmp/dist/en/deck.json
      - name: Check the valid dist with the local action
        uses: ./action
        with:
          path: /tmp/dist
          deckdock-ref: local
      - name: Build an invalid dist
        run: |
          mkdir -p /tmp/bad/en
          cp spec/examples/invalid/duplicate-guid.json /tmp/bad/en/deck.json
      - name: Check the invalid dist (must fail)
        id: must-fail
        continue-on-error: true
        uses: ./action
        with:
          path: /tmp/bad
          deckdock-ref: local
      - name: Assert the invalid dist was rejected
        if: steps.must-fail.outcome != 'failure'
        run: |
          echo "::error::The action accepted an invalid dist"
          exit 1
